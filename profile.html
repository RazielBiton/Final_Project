<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyCare - פרופיל אישי</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Use identical CSS as after_login for perfect sidebar parity -->
    <link rel="stylesheet" href="css/after_login_styles.css">
    <link rel="stylesheet" href="css/profile_styles.css">
</head>

<body class="homepage is-loading">
    <div class="mesh-bg"></div>

    <div class="layout-container">
        <!-- ═══ SIDEBAR — Exact copy from after_login.html ═══ -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>EasyCare</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="after_login.html" class="sidebar-item">
                    <i class="fas fa-th-large"></i>
                    <span>לוח בקרה ראשי</span>
                </a>
                <a href="profile.html" class="sidebar-item active">
                    <i class="fas fa-user-circle"></i>
                    <span>פרופיל אישי</span>
                </a>
                <div style="margin-top: auto; padding-top: 20px;">
                    <a href="login.html" class="sidebar-item text-danger"
                        onclick="localStorage.removeItem('userCars'); localStorage.removeItem('loggedInUser');">
                        <i class="fas fa-power-off"></i>
                        <span>התנתקות</span>
                    </a>
                </div>
            </nav>

            <!-- User Profile Section at Bottom — Exact copy from after_login.html -->
            <div class="sidebar-profile p-3 mt-4" style="border-top: 1px solid rgba(0,0,0,0.05); display: flex; align-items: center;">
                <img id="sidebarUserImg" src="https://ui-avatars.com/api/?name=U&background=2d74d7&color=fff&rounded=true"
                    class="rounded-circle" width="45" height="45" style="object-fit: cover;">
                <div class="text-end me-3">
                    <h6 id="sidebarUserName" class="m-0 fw-bold" style="font-size: 0.9rem; color: #1d1d1f;">טוען...</h6>
                    <small class="text-muted" style="font-size: 0.75rem;">משתמש רשום</small>
                </div>
            </div>
        </aside>

        <!-- ═══ MAIN CONTENT ═══ -->
        <main class="main-content">
            <!-- Profile Hero -->
            <section class="profile-hero">
                <div class="avatar-wrapper">
                    <img id="profileAvatarPreview"
                        src="https://ui-avatars.com/api/?name=User&background=0071e3&color=fff&rounded=true"
                        alt="Profile Avatar">
                    <label for="avatarUpload" class="avatar-edit-label">
                        <i class="fas fa-camera"></i>
                    </label>
                    <input type="file" id="avatarUpload" accept="image/*" style="display: none;">
                </div>
                <div class="hero-info">
                    <div class="badge-member"><i class="fas fa-user-check"></i> משתמש רשום</div>
                    <h1 id="heroNameText">טוען פרופיל...</h1>
                    <div class="account-stats">
                        <div class="stat-item"><i class="fas fa-car"></i> <b id="statCarCount">0</b> רכבים בצי</div>
                        <div class="stat-item"><i class="fas fa-bell"></i> <b id="statActiveAlerts">0</b> התראות פתוחות</div>
                    </div>
                </div>
            </section>

            <!-- Settings Grid -->
            <div class="settings-grid">
                <!-- Personal Details -->
                <section class="settings-card">
                    <h2><i class="fas fa-id-card"></i> פרטים אישיים</h2>
                    <form id="profileDetailsForm">
                        <div class="form-group">
                            <label for="fullName">שם מלא</label>
                            <input type="text" id="fullName" class="premium-input" placeholder="הזן שם מלא" required>
                        </div>
                        <div class="form-group">
                            <label for="email">כתובת אימייל</label>
                            <input type="email" id="email" class="premium-input" placeholder="email@example.com" required>
                        </div>
                        <div class="form-group">
                            <label for="phone">מספר טלפון</label>
                            <input type="tel" id="phone" class="premium-input" dir="ltr" placeholder="050-0000000">
                        </div>
                        <button type="submit" class="btn-premium">שמור שינויים</button>
                    </form>
                </section>

                <div style="display: flex; flex-direction: column; gap: 2rem;">
                    <!-- Security -->
                    <section class="settings-card">
                        <h2><i class="fas fa-shield-alt"></i> אבטחת חשבון</h2>
                        <form id="securityForm">
                            <div class="form-group">
                                <label for="currentPassword">סיסמה נוכחית</label>
                                <input type="password" id="currentPassword" class="premium-input" required>
                            </div>
                            <div class="form-group">
                                <label for="newPassword">סיסמה חדשה</label>
                                <input type="password" id="newPassword" class="premium-input" required>
                            </div>
                            <button type="submit" class="btn-premium btn-danger-premium">עדכן סיסמה</button>
                        </form>
                    </section>

                    <!-- Notifications -->
                    <section class="settings-card">
                        <h2><i class="fas fa-bell"></i> העדפות התראות</h2>
                        <div class="toggle-list">
                            <div class="toggle-item">
                                <span class="toggle-label">תזכורת חודש לפני טסט</span>
                                <input type="checkbox" checked>
                            </div>
                            <div class="toggle-item">
                                <span class="toggle-label">תזכורת שבוע לפני ביטוח</span>
                                <input type="checkbox" checked>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </div>

    <script src="js/profile.js"></script>
    <script src="js/global-autosave.js"></script>
</body>
</html>
