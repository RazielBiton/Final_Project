<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyCare - תוצאות חיפוש גלובלי</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Main CSS -->
    <link rel="stylesheet" href="css/dashboard.css">
    <!-- Custom Search Results CSS -->
    <link rel="stylesheet" href="css/search_results.css">
    <link rel="stylesheet" href="css/global_footer.css">
</head>

<body style="background-color: #f4f7f6;">

    <!-- Top Nav -->
    <nav class="db-navbar shadow-sm bg-white" style="position: sticky; top: 0; z-index: 1000;">
        <div class="db-nav-content d-flex align-items-center cursor-pointer" onclick="window.location.href='after_login.html'">
            <i class="fas fa-arrow-right primary-text fs-4 db-me-3"></i>
            <h2 class="m-0 ms-2" style="font-size: 1.3rem; font-weight: bold; color: #0d6efd;">חזור לאזור אישי</h2>
        </div>

        <!-- Global Search Bar inside Search Page -->
        <div class="db-nav-content flex-grow-1 d-flex justify-content-center px-2 px-md-4">
            <form class="d-flex position-relative w-100" style="max-width: 500px;" onsubmit="event.preventDefault(); window.searchVehicles();">
                <input type="text" id="topSearchInput" autocomplete="off" class="form-control rounded-pill pe-4" placeholder="חיפוש לפי יצרן או מספר רישוי..." style="box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 2px solid #0d6efd; font-size: 1rem; padding-left: 3rem !important;">
                <button type="submit" class="btn position-absolute top-50 translate-middle-y p-0" style="left: 15px; color: #0d6efd; border: none; background: transparent;">
                    <i class="fas fa-search fs-5"></i>
                </button>
                <ul id="globalAutocompleteList" class="list-group position-absolute w-100 shadow d-none" style="top: 110%; z-index: 2000; max-height: 250px; overflow-y: auto; text-align: right; border-radius: 12px; font-size: 0.9rem;"></ul>
            </form>
        </div>
        
        <div class="db-nav-content" style="margin-right: auto;">
             <div class="text-center">
                 <h4 class="m-0 fw-bold" style="color:#0d6efd;">
                     <i class="fas fa-car me-1"></i> EasyCare Search
                 </h4>
             </div>
        </div>
    </nav>

    <div class="container-fluid py-4">
        
        <!-- Loading State -->
        <div id="loadingIndicator" class="text-center text-muted" style="padding: 5rem;">
            <i class="fas fa-spinner fa-spin fa-3x mb-3 text-primary"></i>
            <h5>מאתר רכבים...</h5>
        </div>

        <!-- Main Content (Hidden Initially) -->
        <div id="mainContent" class="row d-none">
            
            <!-- Sidebar: Dynamic Filters -->
            <div class="col-lg-3 col-md-4 mb-4">
                <div class="card shadow-sm border-0" style="border-radius: 12px; position: sticky; top: 90px;">
                    <div class="card-header bg-white border-bottom-0 pt-4 pb-2">
                        <h5 class="fw-bold m-0"><i class="fas fa-filter text-primary me-2"></i> סינון תוצאות</h5>
                    </div>
                    <div class="card-body">
                        
                        <!-- Brands Filter -->
                        <div class="filter-section mb-4" id="filter-brands-container">
                            <h6 class="fw-bold text-secondary mb-2">יצרן</h6>
                            <div id="filter-brands-list" class="d-flex flex-column gap-2">
                                <!-- Rendered dynamically -->
                            </div>
                        </div>

                        <!-- Fuel Type Filter -->
                        <div class="filter-section mb-4" id="filter-fuel-container">
                            <h6 class="fw-bold text-secondary mb-2">סוג הנעה</h6>
                            <div id="filter-fuel-list" class="d-flex flex-column gap-2">
                                <!-- Rendered dynamically -->
                            </div>
                        </div>

                        <!-- Color Filter -->
                        <div class="filter-section mb-3" id="filter-colors-container">
                            <h6 class="fw-bold text-secondary mb-2">צבע</h6>
                            <div id="filter-colors-list" class="d-flex flex-column gap-2">
                                <!-- Rendered dynamically -->
                            </div>
                        </div>
                        
                    </div>
                </div>
            </div>

            <!-- Results Grid -->
            <div class="col-lg-9 col-md-8">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="fw-bold m-0 text-dark">תוצאות חיפוש <span id="resultsCountBadge" class="badge bg-primary rounded-pill fs-6 ms-2">0</span></h4>
                </div>
                
                <div id="noResultsMsg" class="d-none text-center py-5">
                    <img src="images/icons/search.png" alt="No Data" style="max-width: 120px; opacity: 0.5; margin-bottom: 20px;">
                    <h4 class="text-muted fw-bold">לא נמצאו רכבים התואמים לפילטרים.</h4>
                    <p class="text-muted">נסה לשנות את מילות החיפוש או לנקות את הסינונים.</p>
                </div>

                <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4" id="resultsGrid">
                    <!-- Rendered dynamically -->
                </div>
            </div>

        </div>
    </div>

    <footer class="global-footer mt-auto"></footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/brand-map.js"></script> <!-- Optional mapping if needed -->
    <script src="js/search_results.js"></script>
    <script src="js/global_footer.js"></script>
</body>
</html>
