<!DOCTYPE html>
<!-- 
  @fileoverview results.html
  @description עמוד תוצאות מפורט עבור רכב בודד הנמשך ממאגרי המידע הממשלתיים. מציג נתונים טכניים, תאריכי תוקף ואפשרות הוספה לצי הרכבים האישי.
  @author Michael Geyshes & Raziel Biton
  @version 1.0.0
-->
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/after_login.css?v=3" />
    <link rel="stylesheet" href="css/after_login_styles.css?v=4" />
    <link rel="stylesheet" href="css/global_footer.css?v=3" />
    <link rel="stylesheet" href="css/profile.css?v=3" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/search_styles.css?v=2">
    <title>EasyCare - פרטי רכב</title>
</head>

<body class="homepage is-loading">
    <!-- === שכבת טעינה (Loading Overlay) === -->
    <div id="loading" class="loading-overlay">
        <div class="loading-spinner"></div>
        <span>מתחבר למאגר הממשלתי...</span>
    </div>

    <!-- === רקע מעוצב (Mesh Background) === -->
    <div class="mesh-bg"></div>

    <div class="layout-container">
        <!-- === סרגל צד (תפריט ניווט ראשי צי רכבים) === -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>EasyCare</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="after_login.html" class="sidebar-item">
                    <i class="fas fa-th-large"></i> 
                    <span>לוח בקרה ראשי</span>
                </a>
                <a href="profile.html" class="sidebar-item">
                    <i class="fas fa-user-circle"></i> 
                    <span>פרופיל אישי</span>
                </a>
                <div style="margin-top: auto; padding-top: 20px;">
                    <a href="#" class="sidebar-item text-danger" onclick="handleLogout(event)">
                        <i class="fas fa-power-off"></i> 
                        <span>התנתקות</span>
                    </a>
                </div>
            </nav>
            
            <!-- אזור פרופיל משתמש בתחתית הסרגל -->
            <div class="sidebar-profile p-3 mt-4" style="border-top: 1px solid rgba(0,0,0,0.05); display: flex; align-items: center;">
                <img id="sidebarUserImg" src="https://ui-avatars.com/api/?name=U&background=2d74d7&color=fff&rounded=true" class="rounded-circle" width="45" height="45" style="object-fit: cover;">
                <div class="text-end me-3">
                    <h6 id="sidebarUserName" class="m-0 fw-bold" style="font-size: 0.9rem; color: #1d1d1f;">טוען...</h6>
                    <small class="text-muted" style="font-size: 0.75rem;">משתמש רשום</small>
                </div>
            </div>
        </aside>

        <main class="main-content">
            
            <!-- === ניווט עליון במובייל (Mobile Top Nav) === -->
            <div class="mobile-top-nav d-md-none">
                <a href="after_login.html" class="btn-back-mobile">
                    <i class="fas fa-arrow-right"></i> חזרה לצי הרכבים
                </a>
            </div>

            <!-- === כותרת תוצאות ראשית (Hero) === -->
            <div class="results-hero">
                <h1><i class="fas fa-car" style="color: var(--primary-blue); margin-left: 12px;"></i> פרטי הרכב</h1>
                <div class="plate-badge" id="plateBadge">---</div>
            </div>

            <!-- === כרטיסיות פרטי הרכב (Grid) === -->
            <div class="detail-grid" id="detailGrid">
                <div class="detail-card"><div class="detail-card-icon"><i class="fas fa-hashtag"></i></div><div class="detail-card-text"><label>מספר רישוי</label><span id="res_plate">—</span></div></div>
                <div class="detail-card"><div class="detail-card-icon"><i class="fas fa-industry"></i></div><div class="detail-card-text"><label>יצרן</label><span id="res_make">—</span></div></div>
                <div class="detail-card"><div class="detail-card-icon"><i class="fas fa-car-side"></i></div><div class="detail-card-text"><label>דגם</label><span id="res_model">—</span></div></div>
                <div class="detail-card"><div class="detail-card-icon"><i class="fas fa-calendar-alt"></i></div><div class="detail-card-text"><label>שנת ייצור</label><span id="res_year">—</span></div></div>
                <div class="detail-card"><div class="detail-card-icon"><i class="fas fa-palette"></i></div><div class="detail-card-text"><label>צבע</label><span id="res_color">—</span></div></div>
                <div class="detail-card"><div class="detail-card-icon"><i class="fas fa-gas-pump"></i></div><div class="detail-card-text"><label>סוג דלק</label><span id="res_fuel">—</span></div></div>
                <div class="detail-card"><div class="detail-card-icon"><i class="fas fa-clipboard-check"></i></div><div class="detail-card-text"><label>תוקף טסט</label><span id="res_test">—</span></div></div>
                <div class="detail-card"><div class="detail-card-icon"><i class="fas fa-id-card"></i></div><div class="detail-card-text"><label>תוקף רישיון רכב</label><span id="res_license">—</span></div></div>
                <div class="detail-card"><div class="detail-card-icon"><i class="fas fa-smog"></i></div><div class="detail-card-text"><label>קבוצת זיהום</label><span id="res_pollution">—</span></div></div>
                <div class="detail-card"><div class="detail-card-icon"><i class="fas fa-circle-notch"></i></div><div class="detail-card-text"><label>צמיג קדמי</label><span id="res_tire_f">—</span></div></div>
                <div class="detail-card"><div class="detail-card-icon"><i class="fas fa-circle-notch"></i></div><div class="detail-card-text"><label>צמיג אחורי</label><span id="res_tire_r">—</span></div></div>
                
                <!-- שדות הניתנים לעריכה על ידי המשתמש (קילומטראז', נפח, כ"ס) -->
                <div class="detail-card editable-card">
                    <div class="detail-card-icon bg-light text-primary"><i class="fas fa-tachometer-alt"></i></div>
                    <div class="detail-card-text w-100">
                        <label>קילומטראז' הנוכחי</label>
                        <div class="input-wrapper">
                            <input type="tel" id="res_km" class="detail-input focus-ring" placeholder="הזן ק״מ מדויק..." oninput="this.value=this.value.replace(/\D/g,'')">
                            <i class="fas fa-pen input-icon"></i>
                        </div>
                    </div>
                </div>
                <div class="detail-card editable-card">
                    <div class="detail-card-icon bg-light text-primary"><i class="fas fa-cog"></i></div>
                    <div class="detail-card-text w-100">
                        <label>נפח מנוע / קוט״ש</label>
                        <div class="input-wrapper">
                            <input type="text" id="manual_volume" class="detail-input focus-ring" placeholder="הזן נפח מנוע / קוט״ש...">
                            <i class="fas fa-pen input-icon"></i>
                        </div>
                    </div>
                </div>
                <div class="detail-card editable-card">
                    <div class="detail-card-icon bg-light text-primary"><i class="fas fa-horse-head"></i></div>
                    <div class="detail-card-text w-100">
                        <label>כוח סוס (כ״ס)</label>
                        <div class="input-wrapper">
                            <input type="text" id="manual_hp" class="detail-input focus-ring" placeholder="הזן כוח סוס...">
                            <i class="fas fa-pen input-icon"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- === התראת תג נכה (Disabled Tag Notice) === -->
            <div id="disabledTagBox" class="notice-card warning" style="display:none;">
                <div class="notice-icon"><i class="fas fa-wheelchair"></i></div>
                <div class="notice-text">
                    <h3 id="tagText">בודק זכאות...</h3>
                    <p>בדיקת תו נכה מול מאגר רשות האוכלוסין</p>
                </div>
            </div>

            <!-- === אזור כפתורי פעולה (Action Area) === -->
            <div class="action-area">
                <button class="btn-add-car" id="addBtn">
                    <i class="fas fa-plus-circle"></i> הוסף לרשימת הרכבים שלי
                </button>
                <button class="btn-search-again" onclick="window.location.href='search.html'">
                    <i class="fas fa-redo"></i> חיפוש מחדש
                </button>
            </div>
            
            <footer class="global-footer"></footer>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth_utils.js"></script>
    <script src="js/global_footer.js"></script>
    <script src="js/chatbot.js"></script>
    <script src="js/global-autosave.js"></script>
    <script src="js/brand-map.js"></script>
    
    <script>
    /**
     * מסיר את קלאס הטעינה לאחר שהעמוד נטען במלואו.
     * 
     * @returns {void}
     */
    document.addEventListener("DOMContentLoaded", () => {
        document.body.classList.remove('is-loading');
    });

    /**
     * טוען נתוני משתמש לסרגל הצד (Sidebar).
     * במידה ויש משתמש מחובר ב-SessionStorage - יציג את שמו ותמונתו.
     * 
     * @returns {void}
     */
    (function() {
        const user = JSON.parse(sessionStorage.getItem('loggedInUser') || '{}');
        const nameEl = document.getElementById('sidebarUserName');
        const imgEl = document.getElementById('sidebarUserImg');
        if (nameEl) nameEl.textContent = user.fullName || 'משתמש';
        if (imgEl && (user.avatar || user.fullName)) {
            imgEl.src = user.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.fullName||'U')}&background=2d74d7&color=fff&rounded=true`;
        }
    })();

    /**
     * מחזיר תאריך בפורמט DD/MM/YYYY.
     * 
     * @param {string} dateStr - מחרוזת תאריך מהשרת
     * @returns {string} תאריך מעוצב
     */
    function formatDateOnly(dateStr) {
        if (!dateStr) return "אין נתונים";
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return dateStr;
        return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
    }

    /**
     * פורמט תאריך טסט הבא.
     * מוסיף שנה לתאריך שנמשך כדי להציג את מועד מבחן הרישוי הבא.
     * 
     * @param {string} dateStr - מחרוזת תאריך מקורית מהשרת
     * @returns {string} תאריך טסט מעוצב ומוגדל בשנה
     */
    function formatNextTestDate(dateStr) {
        if (!dateStr) return "אין נתונים";
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return dateStr;
        d.setFullYear(d.getFullYear() + 1);
        return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
    }

    /**
     * מאזין לאירוע טעינת הדף, מושך את מספר הרישוי מה-URL ומבצע בקשות ל-API הממשלתי (data.gov.il).
     * מפענח את התשובה ומאכלס את השדות בדף התוצאות, כולל בדיקת זכאות לתו נכה.
     * 
     * @returns {Promise<void>}
     */
    document.addEventListener('DOMContentLoaded', async () => {
        const plate = new URLSearchParams(window.location.search).get('plate');
        if (!plate) { alert("לא הוזן מספר רכב"); window.location.href = 'search.html'; return; }

        document.getElementById('plateBadge').textContent = plate;

        try {
            const carResId = '053cea08-09bc-40ec-8f7a-156f0677aff3';
            const carUrl = `https://data.gov.il/api/3/action/datastore_search?resource_id=${carResId}&q=${plate}`;
            const carResp = await fetch(carUrl);
            const carData = await carResp.json();

            if (carData.success && carData.result.records.length > 0) {
                const car = carData.result.records[0];
                document.getElementById('res_plate').textContent = car.mispar_rechev;
                document.getElementById('res_make').textContent = car.tozeret_nm;
                document.getElementById('res_model').textContent = car.kinuy_mishari || "לא מוגדר";
                document.getElementById('res_year').textContent = car.shnat_yitzur;
                document.getElementById('res_color').textContent = car.tzeva_rechev;
                let fuelType = car.sug_delek_nm;
                if (car.kinuy_mishari && car.kinuy_mishari.toLowerCase().includes('hybrid')) {
                    fuelType = 'חשמל/בנזין (היברידי)';
                }
                document.getElementById('res_fuel').textContent = fuelType;
                document.getElementById('res_test').textContent = formatNextTestDate(car.mivchan_acharon_dt);
                document.getElementById('res_license').textContent = formatDateOnly(car.tokef_dt);
                document.getElementById('res_pollution').textContent = car.kvutzat_zihum;
                document.getElementById('res_tire_f').textContent = car.zmig_kidmi;
                document.getElementById('res_tire_r').textContent = car.zmig_ahori;
                if (car.nefah_manoa) document.getElementById('manual_volume').value = car.nefah_manoa;
                if (car.koah_sus) document.getElementById('manual_hp').value = car.koah_sus;
            } else {
                alert("רכב לא נמצא במאגר");
            }

            // Disabled tag check
            const tagResId = 'c8b9f9c8-4612-4068-934f-d4acd2e3c06e';
            const tagResp = await fetch(`https://data.gov.il/api/3/action/datastore_search?resource_id=${tagResId}&q=${plate}`);
            const tagData = await tagResp.json();
            const hasTag = tagData.result.records.length > 0;
            const tagBox = document.getElementById('disabledTagBox');
            const tagText = document.getElementById('tagText');
            tagBox.style.display = 'flex';

            if (hasTag) {
                tagBox.className = 'notice-card success';
                tagText.textContent = '♿ לרכב זה יש תו נכה פעיל במאגר';
            } else {
                tagBox.className = 'notice-card warning';
                tagText.textContent = 'לרכב זה אין תו נכה במאגר';
            }
        } catch (err) {
            console.error(err);
            alert("שגיאה בחיבור למאגרי הממשלה");
        } finally {
            document.getElementById('loading').style.display = 'none';
        }
    });

    /**
     * פונקציית הוספת הרכב הנבחר לצי הרכבים האישי של המשתמש.
     * בונה אובייקט רכב מתוך הנתונים שמוצגים בדף ושולחת אותו ל-API השמירה שלנו.
     * 
     * @returns {Promise<void>}
     */
    document.getElementById('addBtn').onclick = async function() {
        const btn = this;
        btn.textContent = "מעבד...";
        btn.disabled = true;

        const makeFull = document.getElementById('res_make').textContent;
        const hebrewBrand = makeFull.split('-')[0].trim();

        try {
            let englishBrand = typeof window.getEnglishBrandName === 'function'
                ? window.getEnglishBrandName(hebrewBrand) : 'default';

            const newCar = {
                id: Date.now(),
                brandHeb: hebrewBrand,
                model: document.getElementById('res_model').textContent,
                year: document.getElementById('res_year').textContent,
                logo: `images/logos/${englishBrand}.png`,
                licensePlate: document.getElementById('res_plate').textContent,
                testDate: document.getElementById('res_test').textContent,
                licenseExpiry: document.getElementById('res_license').textContent,
                color: document.getElementById('res_color').textContent,
                fuelType: document.getElementById('res_fuel').textContent,
                pollution: document.getElementById('res_pollution').textContent,
                tireFront: document.getElementById('res_tire_f').textContent,
                tireRear: document.getElementById('res_tire_r').textContent,
                hasDisabledTag: document.getElementById('disabledTagBox').classList.contains('success'),
                km: parseInt(document.getElementById('res_km').value) || 0,
                engineVolume: document.getElementById('manual_volume').value || '',
                horsePower: document.getElementById('manual_hp').value || '',
                treatments: [], accidents: [], fuelLog: [], reports: []
            };

            const userId = sessionStorage.getItem('userId');
            const response = await fetch('/api/vehicles', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'userid': userId || '1' },
                body: JSON.stringify(newCar)
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error || `Server ${response.status}`);
            }
            const data = await response.json();

            const existingCars = JSON.parse(sessionStorage.getItem('userCars')) || [];
            newCar.id = data.vehicleId;
            existingCars.push(newCar);
            sessionStorage.setItem('userCars', JSON.stringify(existingCars));

            window.location.href = 'after_login.html';
        } catch (err) {
            console.error(err);
            alert(err.message || "שגיאה בעיבוד הנתונים. נסה שוב.");
            btn.innerHTML = '<i class="fas fa-plus-circle"></i> הוסף לרשימת הרכבים שלי';
            btn.disabled = false;
        }
    };
    </script>
</body>
</html>
