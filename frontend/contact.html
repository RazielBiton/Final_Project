<!DOCTYPE html>
<!-- 
  @fileoverview contact.html
  @description עמוד יצירת קשר עם מערכת EasyCare. העמוד מאפשר לשלוח פניות באמצעות טופס ייעודי עם חיווי לתוצאת השליחה.
  @author Michael Geyshes & Raziel Biton
  @version 1.0.0
-->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/contact.css" />
  <link rel="stylesheet" href="css/global_footer.css" />

  <title>Contact</title>
</head>

<body>
  <!-- === מעטפת דף צור קשר (Main Container) === -->
  <div class="container">
    <div class="form-container">
      
      <!-- === אזור מידע טקסטואלי (Left Container) === -->
      <div class="left-container">
        <div class="left-inner-container">
          <h2>!בואו נדבר</h2>
          <p>נשמח לשמוע ממך! מלאו את הפרטים כאן למטה, ואנחנו נחזור אליך בהקדם עם כל התשובות</p>
          <p>שירות הוא מעל הכל אצלנו</p>
          <br>
          <h1>Easy-Care</h1>
          <br>
          <br>
          <a class="btn_home" href="index.html">חזור לדף הבית</a>
        </div>
      </div>
      
      <!-- === אזור טופס הפנייה (Right Container) === -->
      <div class="right-container">
        <div class="right-inner-container">
          <form id="contactForm">
            <h2 class="lg-view">צור קשר</h2>
            <h2 class="sm-view">צור קשר</h2>

            <input type="text" id="contactName" placeholder="שם מלא" required />
            <input type="email" id="contactEmail" placeholder="אימייל" required />
            <input type="tel" id="contactPhone" placeholder="מספר טלפון" required />
            
            <!-- אזור הזנת תוכן ההודעה כולל ספירת תווים למובייל -->
            <textarea rows="4" id="contactMessage" placeholder="אנא הכנס הודעתך" required maxlength="300"></textarea>
            <div id="mobileCharCount" style="text-align: left; font-size: 0.8rem; color: #6c757d; margin-top: -5px; margin-bottom: 10px;">0/300</div>
            
            <div class="mobile-buttons-wrapper">
              <button type="submit" id="contactSubmitBtn">שלח</button>
              <p id="contactFeedback" style="display: none; margin-top: 10px; font-weight: bold;"></p>
              <a class="sm-view btn_home" href="index.html">חזור לדף הבית</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- === סקריפטים (Scripts) === -->
  <script src="js/contact.js"></script>
  <script src="js/global-autosave.js"></script>
</body>

</html>
