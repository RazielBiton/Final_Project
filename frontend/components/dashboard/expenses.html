<div id="expenses-section" class="dashboard-section d-none">
    <!-- Top Row: Apple Wallet Premium Card & AI Insights -->
    <div class="db-row mb-4">
        <!-- Sleek High-Performance Platinum Widget -->
        <div class="db-col-lg-5 mb-4 mb-lg-0">
            <div class="platinum-expense-card h-100">
                <!-- Glowing Top Accent Line -->
                <div class="pec-accent-line"></div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="pec-icon-wrap">
                        <i class="fas fa-credit-card"></i>
                    </div>
                    <div class="pec-plate-badge">
                        <i class="fas fa-car me-2" style="opacity: 0.6;"></i>
                        <span id="walletVehiclePlate">000-00-000</span>
                    </div>
                </div>

                <div class="pec-balance-wrap">
                    <h6 class="pec-label">סך הוצאות מצטבר</h6>
                    <div class="pec-amount-group">
                        <span class="pec-currency">₪</span>
                        <!-- JS sets "XXXX ₪", so we remove the currency here to avoid double ₪ if the JS still appends it -->
                        <h2 class="pec-value m-0" id="totalYearlyExpenses">0 ₪</h2>
                    </div>
                </div>

                <div class="pec-footer mt-4 pt-3">
                    <div>
                        <small class="pec-label d-block mb-1">חודש נוכחי (משוער)</small>
                        <span class="pec-monthly-val" id="avgMonthlyExpense">0 ₪</span>
                    </div>
                    <button class="pec-add-btn" onclick="openAddExpenseModal()">
                        <i class="fas fa-plus pe-1"></i>
                        <span>רישום הוצאה</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Smart AI Financial Insights -->
        <div class="db-col-lg-7">
            <div class="db-glass-card border-radius-premium h-100 p-4"
                style="display: flex; flex-direction: column; justify-content: center;">
                <h5 class="fw-bold mb-3 primary-text"><i class="fas fa-brain me-2"></i> ניתוח פיננסי אוטומטי</h5>
                <div id="ai-insight-content" class="ai-insights-box">
                    <i class="fas fa-sparkles ai-icon-sparkle mt-1"></i>
                    <div>
                        <h6 class="fw-bold text-dark m-0 mb-1" style="font-size: 1.05rem;" id="ai-insight-title">מנתח
                            נתונים...</h6>
                        <p class="text-muted m-0" style="font-size: 0.95rem; line-height: 1.5;" id="ai-insight-text">
                            המערכת שלנו אוספת את כל נתוני ההוצאות שלך, החל מדלק, ביטוחים, ועד תיקונים, כדי להציג בפניך
                            תמונת כסף מדויקת.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content Row -->
    <div class="db-row">
        <!-- Right Column: Chart (Doughnut without messy default legend) -->
        <div class="db-col-lg-5 mb-4">
            <div class="db-glass-card h-100 border-radius-premium">
                <div class="db-card-header bg-transparent border-bottom-0 pb-0 pt-4 px-4">
                    <h5 class="m-0 fw-bold primary-text"><i class="fas fa-chart-donut me-2"></i> התפלגות כספית</h5>
                </div>
                <div class="db-card-body px-4 pb-4">
                    <div class="chart-container-premium">
                        <canvas id="expensesDistributionChart"></canvas>
                        <div class="chart-center-wrapper">
                            <span id="chartCenterTotal">0 ₪</span>
                            <span class="chart-center-label">סך הכל</span>
                        </div>
                    </div>
                    <!-- Custom HTML Legend -->
                    <div id="custom-chart-legend" class="custom-chart-legend">
                        <!-- Rendered by JS -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Left Column: Apple Pay Style Transactions -->
        <div class="db-col-lg-7 mb-4">
            <div class="db-glass-card h-100 border-radius-premium d-flex flex-column">
                <div class="db-card-header bg-transparent border-bottom-0 pt-4 px-4 pb-2 db-flex-between">
                    <h5 class="m-0 fw-bold text-dark"><i class="fas fa-list-ul me-2"></i> פעולות אחרונות (שונות)</h5>
                    <button class="db-btn db-btn-sm"
                        style="background:#f1f5f9; color:#64748b; border:none; font-weight:600;"
                        onclick="openAddExpenseModal()">+ הוסף</button>
                </div>
                <div class="db-card-body p-0 flex-grow-1" style="max-height: 380px; overflow-y: auto;">
                    <div id="custom-expenses-list">
                        <!-- Rendered by JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
