<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/after_login.css?v=3" />
    <link rel="stylesheet" href="css/after_login_styles.css?v=4" />
    <link rel="stylesheet" href="css/global_footer.css?v=3" />
    <link rel="stylesheet" href="css/profile.css?v=3" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>EasyCare - Fleet Dashboard</title>
</head>

<body class="homepage is-loading">
    <!-- Animated Mesh Background -->
    <div class="mesh-bg"></div>

    <div class="layout-container">
        <!-- Sidebar Navigation (Main Fleet Level) -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>EasyCare</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="after_login.html" class="sidebar-item active">
                    <i class="fas fa-th-large"></i> 
                    <span>לוח בקרה ראשי</span>
                </a>
                <a href="profile.html" class="sidebar-item">
                    <i class="fas fa-user-circle"></i> 
                    <span>פרופיל אישי</span>
                </a>
                <div style="margin-top: auto; padding-top: 20px;">
                    <a href="login.html" class="sidebar-item text-danger" 
                        onclick="localStorage.removeItem('userCars'); localStorage.removeItem('loggedInUser');">
                        <i class="fas fa-power-off"></i> 
                        <span>התנתקות</span>
                    </a>
                </div>
            </nav>
            
            <!-- User Profile Section at Bottom -->
            <div class="sidebar-profile p-3 mt-4" style="border-top: 1px solid rgba(0,0,0,0.05); display: flex; align-items: center;">
                <img id="sidebarUserImg" src="https://ui-avatars.com/api/?name=U&background=2d74d7&color=fff&rounded=true" class="rounded-circle" width="45" height="45" style="object-fit: cover;">
                <div class="text-end me-3">
                    <h6 id="sidebarUserName" class="m-0 fw-bold" style="font-size: 0.9rem; color: #1d1d1f;">טוען...</h6>
                    <small class="text-muted" style="font-size: 0.75rem;">משתמש רשום</small>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <!-- Hero Greeting -->
            <header class="hero-header">
                <h1 id="heroGreeting">בוקר טוב, משתמש!</h1>
                <p class="hero-subtitle">נהל את צי הרכבים שלך בצורה חכמה, שקופה ומתקדמת. כל המידע שאתה צריך נמצא ממש כאן.</p>
                
                <div class="fleet-stats" id="fleetStatsArea">
                    <div class="stat-chip">
                        <i class="fas fa-car-side"></i>
                        <span id="carCountStat">0 רכבים רשומים</span>
                    </div>
                </div>
            </header>

            <!-- Search Area -->
            <div class="search-container">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="fleetSearch" class="search-input" placeholder="חפש רכב בצי (מספר רישוי או דגם)..." oninput="filterFleet()">
            </div>

            <div class="container-fluid p-0">
                <div class="row" id="vehicleRow">
                    <!-- Cards will be injected here -->
                    <div class="col-12 col-md-6 col-lg-4 col-xl-3 premium-card-wrapper" id="addCardWrapper">
                        <div class="premium-card add-premium-card" onclick="window.location.href='search.html'">
                            <div class="add-icon-circle">
                                <i class="fas fa-plus"></i>
                            </div>
                            <h3 class="car-name">הוסף רכב חדש</h3>
                            <p class="car-year">לחץ כאן כדי להרחיב את הצי שלך</p>
                            <a href="search.html" class="btn-premium-enter">התחל עכשיו</a>
                        </div>
                    </div>
                </div>
            </div>
            
            <footer class="global-footer"></footer>
        </main>
    </div>

    <!-- Edit Vehicle Modal -->
    <!-- Edit Vehicle Modal (Premium SaaS Style) -->
    <div class="modal fade" id="editVehicleModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0" style="border-radius: 24px; box-shadow: 0 25px 50px rgba(0,0,0,0.15); overflow: hidden;">
                <div class="modal-header border-0 pb-0" style="background: linear-gradient(135deg, #f8fafc, #f1f5f9);">
                    <h5 class="modal-title fw-bold text-dark" style="font-size: 1.3rem;">עריכת פרטי רכב</h5>
                    <button type="button" class="btn-close me-auto ms-0" data-bs-dismiss="modal" style="background-color: #e2e8f0; border-radius: 50%; opacity: 0.8;"></button>
                </div>
                <div class="modal-body px-4 pt-4 pb-3" style="background: #ffffff;">
                    <form id="editVehicleForm">
                        <div class="mb-4">
                            <label for="editBrand" class="form-label text-muted fw-bold" style="font-size: 0.85rem;">שם יצרן <span class="text-danger">*</span></label>
                            <input type="text" class="form-control form-control-lg border-0 bg-light" id="editBrand" style="border-radius: 12px; font-weight: bold;" required>
                        </div>
                        <div class="mb-4">
                            <label for="editModel" class="form-label text-muted fw-bold" style="font-size: 0.85rem;">דגם <span class="text-danger">*</span></label>
                            <input type="text" class="form-control form-control-lg border-0 bg-light" id="editModel" style="border-radius: 12px; font-weight: bold;" required>
                        </div>
                        
                        <div class="p-3 rounded-4" style="background-color: #f8fafc; border: 1px solid #e2e8f0;">
                            <h6 class="text-primary mb-3 fw-bold"><i class="fas fa-image me-2"></i>לוגו מעודכן</h6>
                            <div class="d-flex align-items-center gap-3">
                                <div class="flex-grow-1">
                                    <input type="file" class="form-control" id="editLogoInput" accept="image/*" style="border-radius: 8px;">
                                </div>
                                <img id="editLogoPreview" src="" class="rounded-circle border bg-white" width="60" height="60" style="object-fit: contain; padding: 5px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);" onerror="this.src='https://ui-avatars.com/api/?name=Car&background=random'">
                            </div>
                        </div>

                        <div id="editVehicleErrorMsg" class="alert alert-danger mt-3 d-none fw-bold" style="border-radius: 12px; font-size: 0.9rem;"></div>
                    </form>
                </div>
                <div class="modal-footer border-0 pt-0 px-4 pb-4" style="background: #ffffff;">
                    <button type="button" class="btn btn-light fw-bold" data-bs-dismiss="modal" style="border-radius: 12px; padding: 10px 20px;">ביטול</button>
                    <button type="button" class="btn btn-primary fw-bold px-4 shadow-sm" id="btnSaveVehicleDetails" style="border-radius: 12px; padding: 10px 24px; transition: all 0.2s; background: var(--primary-blue);">
                        <span class="normal-text">שמור שינויים</span>
                        <span class="loading-text d-none"><i class="fas fa-spinner fa-spin me-2"></i>שומר...</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/after_login.js"></script>
    <script src="js/global_footer.js"></script>
    <script src="js/global-autosave.js"></script>
</body>

</html>
