<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyCare - שחזור סיסמא</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/global_footer.css">
    <style>
        /* Overrides for a centered simple single card using login.css background/theme */
        body.forgot-password-page {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            background: #f6f5f7;
            /* Matches login.css body bg */
        }

        .fp-container {
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.25),
                0 10px 10px rgba(0, 0, 0, 0.22);
            position: relative;
            overflow: hidden;
            width: 400px;
            max-width: 100%;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            text-align: center;
        }

        .fp-container h1 {
            font-weight: bold;
            margin: 0 0 20px;
            color: #333;
        }

        .fp-container p {
            font-size: 14px;
            font-weight: 100;
            line-height: 20px;
            letter-spacing: 0.5px;
            margin: 20px 0 30px;
        }

        .fp-container input {
            background-color: #eee;
            border: none;
            padding: 12px 15px;
            margin: 8px 0;
            width: 100%;
            border-radius: 5px;
            outline: none;
        }

        .fp-container button {
            border-radius: 20px;
            border: 1px solid #2d74d7;
            background-color: #2d74d7;
            color: #ffffff;
            font-size: 12px;
            font-weight: bold;
            padding: 12px 45px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: transform 80ms ease-in;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
        }

        .fp-container button:active {
            transform: scale(0.95);
        }

        .fp-container button:focus {
            outline: none;
        }

        .step {
            width: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .step.active {
            display: flex;
        }

        .back-link {
            color: #333;
            font-size: 14px;
            text-decoration: none;
            margin-top: 20px;
        }

        .fp-container .spinner-border {
            display: none;
            margin-bottom: 15px;
        }
    </style>
</head>

<body class="forgot-password-page">

    <div class="fp-container" id="fpContainer">
        <!-- Step 1: Request OTP -->
        <div class="step active" id="step1">
            <h1>איפוס סיסמא</h1>
            <p>הזן את כתובת האימייל שלך, ואנו נשלח אליך קוד זיהוי (OTP) כדי שתוכל לאפס את הסיסמא.</p>
            <input type="email" id="fpEmail" placeholder="אימייל" required />
            <div class="spinner-border text-danger" id="spinner1" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <button id="sendOtpBtn">שלח קוד</button>
            <a href="login.html" class="back-link">חזרה להתחברות</a>
        </div>

        <!-- Step 2: Verify OTP and Reset Password -->
        <div class="step" id="step2">
            <h1>קוד אימות</h1>
            <p>קוד זיהוי נשלח לאימייל שלך. אנא הזן אותו כאן יחד עם הסיסמא החדשה.</p>
            <input type="text" id="fpOtp" placeholder="קוד ה-OTP מתוך האימייל" required />
            <input type="password" id="fpNewPassword" placeholder="סיסמא חדשה" required />
            <input type="password" id="fpNewPasswordConfirm" placeholder="אימות סיסמא חדשה" required />

            <div class="spinner-border text-danger" id="spinner2" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <button id="verifyOtpBtn">אפס סיסמא</button>
            <a href="login.html" class="back-link">ביטול וחזרה להתחברות</a>
        </div>

        <!-- Step 3: Success -->
        <div class="step" id="step3">
            <h1><i class="fas fa-check-circle text-success" style="font-size: 3rem;"></i></h1>
            <h2 class="mt-3">הסיסמא שונתה בהצלחה!</h2>
            <p>כעת ניתן להתחבר עם הסיסמא החדשה שלך.</p>
            <button onclick="window.location.href='login.html'">התחברות</button>
        </div>
    </div>

    <!-- Global Footer -->
    <footer class="global-footer mt-auto w-100"></footer>

    <script src="js/global_footer.js"></script>
    <script src="js/forgot_password.js"></script>
<script src="js/global-autosave.js"></script>
</body>

</html>
