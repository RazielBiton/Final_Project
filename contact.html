<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/contact.css" />
  <link rel="stylesheet" href="css/global_footer.css" />

  <title>Contact</title>
</head>

<body>
  <div class="container">
    <div class="form-container">
      <div class="left-container">
        <div class="left-inner-container">
          <h2>!בואו נדבר</h2>
          <p>נשמח לשמוע ממך! מלאו את הפרטים כאן למטה, ואנחנו נחזור אליך בהקדם עם כל התשובות</p>
          <p>שירות הוא מעל הכל אצלנו</p>
          <br>
          <h1>Easy-Care</h1>
          <br>
          <br>
          <a class="btn_home" href="index.html">יציאה</a>
        </div>
      </div>
      <div class="right-container">
        <div class="right-inner-container">
          <form id="contactForm">
            <h2 class="lg-view">צור קשר</h2>
            <h2 class="sm-view">צור קשר</h2>

            <input type="text" id="contactName" placeholder="שם מלא" required />
            <input type="email" id="contactEmail" placeholder="אימייל" required />
            <input type="tel" id="contactPhone" placeholder="מספר טלפון" required />
            <textarea rows="4" id="contactMessage" placeholder="אנא הכנס הודעתך" required></textarea>
            
            <button type="submit" id="contactSubmitBtn">שלח</button>
            <p id="contactFeedback" style="display: none; margin-top: 10px; font-weight: bold;"></p>

            <br class="sm-view">
            <br class="sm-view">
            <a class="sm-view btn_home" href="index.html">חזור לדף הבית</a>
          </form>
        </div>
      </div>
    </div>
  </div>


  <script src="js/contact.js"></script>
<script src="js/global-autosave.js"></script>
</body>

</html>
