<div id="expenses-section" class="dashboard-section d-none">
    <!-- Top Row: Apple Wallet Premium Card & AI Insights -->
    <div class="db-row mb-4">
        <!-- Digital Wallet / Apple Card Style -->
        <div class="db-col-lg-5 mb-4 mb-lg-0">
            <div class="db-wallet-card h-100 hover-lift">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <i class="fas fa-wallet fa-2x" style="opacity: 0.8;"></i>
                    </div>
                    <div style="font-family: monospace; font-size: 1.2rem; opacity: 0.8;">
                        <span id="walletVehiclePlate">000-00-000</span> <i class="fas fa-car ms-1"></i>
                    </div>
                </div>
                <div>
                    <h6 style="color: rgba(255,255,255,0.8); font-weight: 500; font-size: 0.95rem; margin-bottom: 2px;">סך ההוצאות המצטבר (כל הזמנים)</h6>
                    <h2 class="m-0 fw-bold" style="font-size: 2.8rem; letter-spacing: -1px; text-shadow: 0 2px 4px rgba(0,0,0,0.2);" id="totalYearlyExpenses">0 ₪</h2>
                </div>
                <div class="d-flex justify-content-between align-items-end mt-4">
                    <div>
                        <small style="color: rgba(255,255,255,0.7); display: block;">חודש נוכחי מעורך</small>
                        <span class="fw-bold fs-5" id="avgMonthlyExpense">0 ₪</span>
                    </div>
                    <button class="db-btn" onclick="openAddExpenseModal()" style="background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.4); border-radius: 20px; padding: 6px 16px; font-weight: 600; font-size: 0.9rem; transition: background 0.2s;">
                        <i class="fas fa-plus me-1"></i> הוסף רישום
                    </button>
                </div>
            </div>
        </div>

        <!-- Smart AI Financial Insights -->
        <div class="db-col-lg-7">
            <div class="db-glass-card border-radius-premium h-100 p-4" style="display: flex; flex-direction: column; justify-content: center;">
                <h5 class="fw-bold mb-3 primary-text"><i class="fas fa-brain me-2"></i> ניתוח פיננסי אוטומטי</h5>
                <div id="ai-insight-content" class="ai-insights-box">
                    <i class="fas fa-sparkles ai-icon-sparkle mt-1"></i>
                    <div>
                        <h6 class="fw-bold text-dark m-0 mb-1" style="font-size: 1.05rem;" id="ai-insight-title">מנתח נתונים...</h6>
                        <p class="text-muted m-0" style="font-size: 0.95rem; line-height: 1.5;" id="ai-insight-text">
                            המערכת שלנו אוספת את כל נתוני ההוצאות שלך, החל מדלק, ביטוחים, ועד תיקונים, כדי להציג בפניך תמונת כסף מדויקת.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content Row -->
    <div class="db-row">
        <!-- Right Column: Chart (Doughnut without messy default legend) -->
        <div class="db-col-lg-5 mb-4">
            <div class="db-glass-card h-100 border-radius-premium">
                <div class="db-card-header bg-transparent border-bottom-0 pb-0 pt-4 px-4">
                    <h5 class="m-0 fw-bold primary-text"><i class="fas fa-chart-donut me-2"></i> התפלגות כספית</h5>
                </div>
                <div class="db-card-body px-4 pb-4">
                    <div class="chart-container-premium">
                        <canvas id="expensesDistributionChart"></canvas>
                        <div class="chart-center-wrapper">
                            <span id="chartCenterTotal">0 ₪</span>
                            <span class="chart-center-label">סך הכל</span>
                        </div>
                    </div>
                    <!-- Custom HTML Legend -->
                    <div id="custom-chart-legend" class="custom-chart-legend">
                        <!-- Rendered by JS -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Left Column: Apple Pay Style Transactions -->
        <div class="db-col-lg-7 mb-4">
            <div class="db-glass-card h-100 border-radius-premium d-flex flex-column">
                <div class="db-card-header bg-transparent border-bottom-0 pt-4 px-4 pb-2 db-flex-between">
                    <h5 class="m-0 fw-bold text-dark"><i class="fas fa-list-ul me-2"></i> פעולות אחרונות (שונות)</h5>
                    <button class="db-btn db-btn-sm" style="background:#f1f5f9; color:#64748b; border:none; font-weight:600;" onclick="openAddExpenseModal()">+ הוסף</button>
                </div>
                <div class="db-card-body p-0 flex-grow-1" style="max-height: 380px; overflow-y: auto;">
                    <div id="custom-expenses-list">
                        <!-- Rendered by JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
